// Speedrun transfer engine: per-concept transfer (T), recall (R) and the gap
// G = R - T. This is the headline change over upstream Anki.

syntax = "proto3";

option java_multiple_files = true;

package anki.speedrun;

import "anki/generic.proto";
import "anki/collection.proto";

service SpeedrunService {
  // Insert or update a concept (mapped 1:1 to the AAMC content outline).
  rpc UpsertConcept(Concept) returns (collection.OpChanges);
  // Insert or update a transfer item (a question at a ladder level).
  rpc UpsertItem(Item) returns (collection.OpChanges);
  // Record the result of answering a transfer item; updates the concept's
  // ability (theta) via an online Elo/IRT update. Undoable.
  rpc RecordTransferReview(RecordTransferReviewRequest)
      returns (collection.OpChanges);
  // Return R, T, G and observation counts for the requested concepts (or all
  // concepts when none are given), plus weighted exam coverage.
  rpc MasteryQuery(MasteryQueryRequest) returns (MasteryQueryResponse);
  // Return concept ids ordered by descending exam_weight * G (highest-value
  // gaps first) - the transfer-gap study queue.
  rpc TransferGapQueue(TransferGapQueueRequest)
      returns (TransferGapQueueResponse);
  // The dashboard: three honest scores (Memory, Performance, Readiness) with
  // ranges, coverage, plain-language reasons and the give-up list.
  rpc ReadinessReport(ReadinessRequest) returns (ReadinessResponse);
  // Pick the next transfer item to study. With concept_id = 0 the top of the
  // transfer-gap queue is used; otherwise the given concept. Returns the
  // lowest unmastered ladder level for that concept.
  rpc NextTransferItem(NextTransferItemRequest)
      returns (NextTransferItemResponse);
  // Export this device's append-only transfer-review log (the sync payload).
  rpc ExportTransferLog(ExportTransferLogRequest) returns (TransferLog);
  // Merge a peer's transfer-review log into this device (union by guid) and
  // replay affected concepts. Idempotent.
  rpc ImportTransferLog(TransferLog) returns (ImportTransferLogResponse);
}

service BackendSpeedrunService {}

message Concept {
  int64 id = 1;
  // AAMC outline code, e.g. "1D".
  string outline_id = 2;
  string section = 3;
  string title = 4;
  // Share of the whole exam; used for coverage and readiness weighting.
  double exam_weight = 5;
}

message Item {
  int64 id = 1;
  int64 concept_id = 2;
  // Ladder level 0..5 (L0 definition .. L5 full passage).
  uint32 level = 3;
  // Item difficulty b (frozen after authoring) for the IRT transfer model.
  double difficulty = 4;
  string source_ref = 5;
  bool ai_generated = 6;
  // Question content.
  string stem = 7;
  repeated string choices = 8;
  // Index into choices of the correct answer.
  uint32 answer = 9;
  string explanation = 10;
}

message RecordTransferReviewRequest {
  int64 item_id = 1;
  int64 concept_id = 2;
  bool correct = 3;
  uint32 latency_ms = 4;
}

message MasteryQueryRequest {
  // When empty, every known concept is returned.
  repeated int64 concept_ids = 1;
}

message ConceptMastery {
  int64 concept_id = 1;
  // Recall probability from FSRS (aggregated to the concept).
  double recall = 2;
  // Transfer probability at a representative MCAT difficulty.
  double transfer = 3;
  // Gap G = R - T.
  double gap = 4;
  uint32 n_transfer_obs = 5;
  double theta = 6;
}

message MasteryQueryResponse {
  repeated ConceptMastery entries = 1;
  // Weighted fraction of the exam with at least one transfer observation.
  double coverage = 2;
}

message TransferGapQueueRequest {
  uint32 limit = 1;
}

message TransferGapQueueResponse {
  repeated int64 concept_ids = 1;
}

message NextTransferItemRequest {
  // 0 = pick the highest-gap concept from the queue.
  int64 concept_id = 1;
}

message NextTransferItemResponse {
  bool found = 1;
  Item item = 2;
  int64 concept_id = 3;
}

message ExportTransferLogRequest {}

// One transfer review as it travels between devices. `guid` is the cross-device
// identity; the local row id is deliberately omitted because it is
// device-local.
message TransferReviewProto {
  string guid = 1;
  int64 item_id = 2;
  int64 concept_id = 3;
  bool correct = 4;
  int64 latency_ms = 5;
  // Answer time in epoch milliseconds; the canonical replay sort key (with guid
  // as a tiebreak).
  int64 ts = 6;
  // Item difficulty (IRT b) captured at answer time. Carried in the log so a
  // replay is self-contained: a device that imported this review but lacks the
  // item locally still computes the same theta as the author (convergence),
  // instead of falling back to a representative difficulty.
  double difficulty = 7;
}

message TransferLog {
  repeated TransferReviewProto reviews = 1;
}

message ImportTransferLogResponse {
  // Reviews that were new to this device.
  uint32 added = 1;
  // Total reviews held after the merge.
  uint32 total = 2;
}

message ReadinessRequest {}

message SectionReadiness {
  // AAMC section short name (e.g. "Bio/Biochem").
  string section = 1;
  // Weighted mean recall R (0..1).
  double memory = 2;
  // Weighted mean transfer T (0..1).
  double performance = 3;
  // Section scaled score (118..132).
  int32 score = 4;
  int32 score_low = 5;
  int32 score_high = 6;
  double coverage = 7;
}

message ReadinessResponse {
  // Weighted mean recall across all in-scope concepts (0..1).
  double memory = 1;
  // Weighted mean transfer across all in-scope concepts (0..1).
  double performance = 2;
  // Predicted total MCAT score (472..528), built on transfer T.
  int32 readiness = 3;
  int32 readiness_low = 4;
  int32 readiness_high = 5;
  // Weighted fraction of the exam with transfer observations.
  double coverage = 6;
  repeated SectionReadiness sections = 7;
  // Plain-language explanations shown under the scores.
  repeated string reasons = 8;
  // Concepts that meet the give-up rule (many attempts, transfer still low).
  repeated int64 give_up_concept_ids = 9;
}
